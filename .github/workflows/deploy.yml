name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && npm run build

      # Branch `deploy` = isi main + public/build, ditambah sebagai commit baru (tanpa force push).
      - name: Publish deploy branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f public/build
          tree=$(git write-tree)
          if git fetch origin deploy; then
            commit=$(git commit-tree "$tree" -p FETCH_HEAD -m "build $GITHUB_SHA")
          else
            commit=$(git commit-tree "$tree" -m "build $GITHUB_SHA")
          fi
          git push origin "$commit:refs/heads/deploy"
